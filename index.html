<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funktionale Zeiterfassung (Bootstrap)</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel für JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <!-- Bootstrap-Klassen direkt am Root für Layout -->
    <div id="root" class="d-flex flex-column vh-100"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        // --- ICONS (Lucide) ---
        const IconSave = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const IconDatabase = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s 9-1.34 9-3V5"></path></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconRefresh = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.5 2v6h-6"></path><path d="M21.34 5.5A10 10 0 1 1 11.79 2"></path></svg>;
        const IconChevronLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>;
        const IconChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
        const IconClock = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;

        // --- UTILS --- (Identisch zur Vorversion)

        const LS_KEY = "zeiterfassung_auth";
        const getAuth = () => {
            try {
                const item = localStorage.getItem(LS_KEY);
                if (!item) return null;
                const parsed = JSON.parse(item);
                if (new Date().getTime() > parsed.expiresAt) {
                    localStorage.removeItem(LS_KEY);
                    return null;
                }
                return parsed.value;
            } catch (e) { return null; }
        };

        const setAuth = (authString) => {
            const [url, token] = authString.split('|');
            if (!url || !token) throw new Error("Format ungültig");
            const data = {
                value: { url: url.trim(), token: token.trim() },
                expiresAt: new Date().getTime() + (14 * 24 * 60 * 60 * 1000)
            };
            localStorage.setItem(LS_KEY, JSON.stringify(data));
            return data.value;
        };

        const redisClient = (auth) => {
            const request = async (command, ...args) => {
                if (!auth) throw new Error("Nicht verbunden");
                let url = auth.url;
                if (!url.endsWith('/')) url += '/';
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${auth.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify([command, ...args])
                });
                const json = await response.json();
                if (json.error) throw new Error(json.error);
                return json.result;
            };
            return {
                get: (key) => request('GET', key),
                set: (key, value) => request('SET', key, typeof value === 'object' ? JSON.stringify(value) : value),
                del: (key) => request('DEL', key),
                scan: (cursor, match, count) => request('SCAN', cursor, 'MATCH', match, 'COUNT', count),
                ping: () => request('PING')
            };
        };

        const getISOWeek = (date) => {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        };

        const getDateOfISOWeek = (w, y) => {
            const simple = new Date(y, 0, 1 + (w - 1) * 7);
            const dow = simple.getDay();
            const ISOweekStart = simple;
            if (dow <= 4) ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
            else ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
            return ISOweekStart;
        };

        const timeToDecimal = (hhmm) => {
            if (!hhmm) return 0;
            const [h, m] = hhmm.split(':').map(Number);
            return h + m / 60;
        };

        const addTime = (startHHMM, hours, minutes) => {
            if (!startHHMM) return '';
            let totalMin = timeToDecimal(startHHMM) * 60 + hours * 60 + minutes;
            const h = Math.floor(totalMin / 60) % 24;
            const m = Math.floor(totalMin % 60);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        };

        const round15Min = (hhmm) => {
            if (!hhmm) return 0;
            const [h, m] = hhmm.split(':').map(Number);
            const totalMin = h * 60 + m;
            const rounded = Math.round(totalMin / 15) * 15;
            return rounded / 60; // Returns hours
        };

        const toLocalIsoDate = (date) => {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        };

        // --- COMPONENTS ---

        // 1. SETTINGS TAB
        const SettingsTab = ({ dbAuth, setDbAuth, setStatus }) => {
            const [inputUrl, setInputUrl] = useState("");
            const [inputToken, setInputToken] = useState("");
            const [stats, setStats] = useState({ count: 0, loading: false });
            const [ini, setIni] = useState({
                defaultPlanHours: [8.75, 8.5, 8.5, 8.5, 5.75],
                defaultPauseMin: 30,
                overtimeThresholdHours: 6
            });
            const [iniLoading, setIniLoading] = useState(false);
            const saveTimeoutRef = useRef(null);

            useEffect(() => {
                if (dbAuth) {
                    loadIni();
                    loadStats();
                }
            }, [dbAuth]);

            const handleConnect = async (e) => {
                e.preventDefault();
                try {
                    let url = inputUrl.trim();
                    let token = inputToken.trim();

                    if (!url || !token) throw new Error("URL und Token müssen ausgefüllt sein");

                    if (!url.startsWith('http')) url = 'https://' + url;
                    if (url.endsWith('/')) url = url.slice(0, -1);

                    const cleanAuthStr = `${url}|${token}`;
                    const tempAuth = { url, token };

                    const client = redisClient(tempAuth);
                    await client.ping();

                    setAuth(cleanAuthStr);
                    setDbAuth(tempAuth);
                    setStatus({ msg: "Verbindung erfolgreich!", type: "success" });
                } catch (err) {
                    setStatus({ msg: "Verbindung fehlgeschlagen: " + err.message, type: "error" });
                }
            };

            const loadStats = async () => {
                setStats(s => ({ ...s, loading: true }));
                try {
                    const client = redisClient(dbAuth);
                    let cursor = '0';
                    let keys = [];
                    do {
                        const res = await client.scan(cursor, 'zeiterfassung:*', 100);
                        cursor = res[0];
                        keys = [...keys, ...res[1]];
                    } while (cursor !== '0');
                    setStats({ count: keys.length, loading: false });
                } catch (e) {
                    setStats(s => ({ ...s, loading: false }));
                }
            };

            const clearDB = async () => {
                if (!confirm("Wirklich alle Zeiterfassungsdaten löschen?")) return;
                try {
                    const client = redisClient(dbAuth);
                    let cursor = '0';
                    do {
                        const res = await client.scan(cursor, 'zeiterfassung:*', 100);
                        cursor = res[0];
                        if (res[1].length > 0) {
                            for (const key of res[1]) await client.del(key);
                        }
                    } while (cursor !== '0');
                    setStatus({ msg: "Datenbank bereinigt.", type: "success" });
                    loadStats();
                } catch (e) {
                    setStatus({ msg: "Fehler beim Löschen: " + e.message, type: "error" });
                }
            };

            const loadIni = async () => {
                setIniLoading(true);
                try {
                    const client = redisClient(dbAuth);
                    const res = await client.get('zeiterfassung:ini');
                    if (res) setIni(JSON.parse(res));
                } catch (e) { }
                setIniLoading(false);
            };

            // Autosave Logik für Settings
            const triggerAutosave = (newIni) => {
                setStatus({ msg: "Änderungen ausstehend...", type: "info" });
                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                saveTimeoutRef.current = setTimeout(async () => {
                    try {
                        const client = redisClient(dbAuth);
                        await client.set('zeiterfassung:ini', newIni);
                        setStatus({ msg: "Einstellungen gespeichert.", type: "success" });
                    } catch (e) {
                        setStatus({ msg: "Fehler beim Speichern: " + e.message, type: "error" });
                    }
                }, 2000); // 2s Debounce
            };

            const updateIni = (newIni) => {
                setIni(newIni);
                triggerAutosave(newIni);
            };

            const updatePlanHour = (idx, val) => {
                const newPlan = [...ini.defaultPlanHours];
                newPlan[idx] = parseFloat(val);
                const newIni = { ...ini, defaultPlanHours: newPlan };
                setIni(newIni);
                triggerAutosave(newIni);
            };

            if (!dbAuth) {
                return (
                    <div className="d-flex align-items-center justify-content-center flex-grow-1">
                        <div className="card shadow-sm" style={{ maxWidth: '500px', width: '100%' }}>
                            <div className="card-body">
                                <h4 className="card-title mb-3 fw-bold">Datenbank verbinden</h4>
                                <p className="text-muted small mb-3">Bitte gib deine Upstash Redis Verbindungsdaten ein.</p>
                                <form onSubmit={handleConnect}>
                                    <div className="mb-3">
                                        <label className="form-label small fw-bold">URL</label>
                                        <input
                                            type="text"
                                            className="form-control font-monospace"
                                            placeholder="https://your-redis-url.upstash.io"
                                            value={inputUrl}
                                            onChange={e => setInputUrl(e.target.value)}
                                            required
                                        />
                                    </div>
                                    <div className="mb-3">
                                        <label className="form-label small fw-bold">Token</label>
                                        <input
                                            type="password"
                                            className="form-control font-monospace"
                                            placeholder="AXXXXXXXXXXXXXXXXXXXXXXXXXx"
                                            value={inputToken}
                                            onChange={e => setInputToken(e.target.value)}
                                            required
                                        />
                                    </div>
                                    <button className="btn btn-primary w-100">Verbinden</button>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container py-4">
                    {/* Settings Card */}
                    <div className="card shadow-sm mb-4">
                        <div className="card-body">
                            <h5 className="card-title border-bottom pb-2 mb-4 fw-bold">Konfiguration (INI)</h5>
                            {iniLoading ? <p>Lade...</p> : (
                                <div>
                                    {/* ZEILE 1: 5 Spalten für Standard Stunden */}
                                    <h6 className="text-uppercase text-secondary fw-bold small mb-3">Standard Stunden (Mo-Fr)</h6>
                                    <div className="row row-cols-5 g-2 mb-4">
                                        {ini.defaultPlanHours.map((h, i) => (
                                            <div key={i} className="col">
                                                <label className="form-label small fw-bold text-muted mb-1">{["Mo", "Di", "Mi", "Do", "Fr"][i]}</label>
                                                <input
                                                    type="number"
                                                    step="0.25"
                                                    className="form-control text-center"
                                                    value={h}
                                                    onChange={(e) => updatePlanHour(i, e.target.value)}
                                                />
                                            </div>
                                        ))}
                                    </div>

                                    {/* ZEILE 2: 2 Spalten (Pause & Schwelle vereint) */}
                                    <h6 className="text-uppercase text-secondary fw-bold small mb-3">Pausenregelungen</h6>
                                    <div className="row g-3">
                                        <div className="col-6">
                                            <label className="form-label small fw-bold text-muted mb-1">Pause</label>
                                            <div className="input-group">
                                                <input
                                                    type="number"
                                                    step="5"
                                                    className="form-control"
                                                    value={ini.defaultPauseMin}
                                                    onChange={(e) => updateIni({ ...ini, defaultPauseMin: parseInt(e.target.value) || 0 })}
                                                />
                                                <span className="input-group-text text-muted small bg-light">Minuten</span>
                                            </div>
                                        </div>
                                        <div className="col-6">
                                            <label className="form-label small fw-bold text-muted mb-1">Schwelle für Pause</label>
                                            <div className="input-group">
                                                <input
                                                    type="number"
                                                    step="0.25"
                                                    className="form-control"
                                                    value={ini.overtimeThresholdHours}
                                                    onChange={(e) => updateIni({ ...ini, overtimeThresholdHours: parseFloat(e.target.value) || 0 })}
                                                />
                                                <span className="input-group-text text-muted small bg-light">Stunden</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* DB Status Card */}
                    <div className="card shadow-sm">
                        <div className="card-body">
                            <h5 className="card-title border-bottom pb-2 mb-3 fw-bold">Datenbank Status</h5>
                            <div className="d-flex justify-content-between align-items-center">
                                <div>
                                    <p className="mb-1 text-muted">Verbundene URL: <br /><code className="text-dark">{dbAuth.url}</code></p>
                                    <p className="mb-0 fw-medium">Größe: {stats.loading ? '...' : `${stats.count} Keys`} (zeiterfassung:*)</p>
                                </div>
                                <div className="btn-group">
                                    <button onClick={loadStats} className="btn btn-outline-secondary" title="Refresh Stats"><IconRefresh /></button>
                                    <button onClick={clearDB} className="btn btn-outline-danger d-flex align-items-center gap-2">
                                        <IconTrash /> Clear DB
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. WEEKLY TAB
        const WeeklyTab = ({ dbAuth, setStatus }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [weekData, setWeekData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [ini, setIni] = useState(null);
            const saveTimeoutRef = useRef(null);

            const year = currentDate.getFullYear();
            const kw = getISOWeek(currentDate);

            useEffect(() => {
                const client = redisClient(dbAuth);
                client.get('zeiterfassung:ini').then(res => {
                    if (res) setIni(JSON.parse(res));
                    else setIni({ defaultPlanHours: [8.75, 8.5, 8.5, 8.5, 5.75], defaultPauseMin: 30, overtimeThresholdHours: 6 });
                });
            }, []);

            useEffect(() => { loadWeek(); }, [year, kw, ini]);

            const loadWeek = async () => {
                if (!ini) return;
                setLoading(true);
                const client = redisClient(dbAuth);
                const key = `zeiterfassung:week:${year}:${kw}`;
                try {
                    const res = await client.get(key);
                    let data;
                    if (res) {
                        data = JSON.parse(res);
                    } else {
                        const monday = getDateOfISOWeek(kw, year);
                        const days = [];
                        const weekDays = ["Mo", "Di", "Mi", "Do", "Fr"];

                        for (let i = 0; i < 5; i++) {
                            const d = new Date(monday);
                            d.setDate(monday.getDate() + i);

                            const p = ini.defaultPlanHours[i] || 0;
                            const pause = p > ini.overtimeThresholdHours ? ini.defaultPauseMin : 0;

                            days.push({
                                dateISO: toLocalIsoDate(d),
                                weekday: weekDays[i],
                                planHours: p,
                                pauseMin: pause,
                                start: "", end: "",
                                forecastEnd: "", actualHours: 0, overtimeHours: 0
                            });
                        }
                        data = { year, isoWeek: kw, days };
                    }
                    setWeekData(data);
                } catch (e) {
                    setStatus({ msg: "Ladefehler: " + e.message, type: "error" });
                }
                setLoading(false);
            };

            const handleDayChange = (idx, field, value) => {
                if (!weekData) return;
                const newDays = [...weekData.days];
                const day = { ...newDays[idx], [field]: value };

                if (field === 'planHours' && ini) {
                    const ph = parseFloat(value) || 0;
                    if (ph < ini.overtimeThresholdHours) {
                        day.pauseMin = 0;
                    } else {
                        if (day.pauseMin === 0) day.pauseMin = ini.defaultPauseMin;
                    }
                }

                const startDec = timeToDecimal(day.start);
                const endDec = timeToDecimal(day.end);
                const plan = parseFloat(day.planHours) || 0;
                const pause = parseInt(day.pauseMin) || 0;

                if (day.start && plan > 0) day.forecastEnd = addTime(day.start, plan, pause);
                else day.forecastEnd = "";

                if (day.start && day.end) {
                    const grossDuration = endDec - startDec;
                    const netDuration = grossDuration - (pause / 60);
                    day.actualHours = parseFloat(netDuration.toFixed(2));
                    day.overtimeHours = parseFloat((day.actualHours - plan).toFixed(2));
                } else {
                    day.actualHours = 0;
                    day.overtimeHours = 0;
                }

                newDays[idx] = day;
                setWeekData({ ...weekData, days: newDays });
                triggerAutosave({ ...weekData, days: newDays });
            };

            const triggerAutosave = (dataToSave) => {
                setStatus({ msg: "Änderungen ausstehend...", type: "info" });
                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                saveTimeoutRef.current = setTimeout(async () => {
                    try {
                        const client = redisClient(dbAuth);
                        const key = `zeiterfassung:week:${dataToSave.year}:${dataToSave.isoWeek}`;
                        await client.set(key, dataToSave);
                        setStatus({ msg: "Gespeichert", type: "success" });
                    } catch (e) {
                        setStatus({ msg: "Fehler beim Autosave", type: "error" });
                    }
                }, 2000); // 2s Debounce
            };

            const clearWeek = async () => {
                if (!confirm("Woche zurücksetzen? Alle Tagesaufgaben dieser Woche werden ebenfalls gelöscht.")) return;
                const client = redisClient(dbAuth);
                const deletes = [`zeiterfassung:week:${year}:${kw}`];
                if (weekData) {
                    for (const day of weekData.days) {
                        deletes.push(`zeiterfassung:tasks:${day.dateISO}`);
                    }
                }
                await Promise.all(deletes.map(k => client.del(k)));
                loadWeek();
            };

            const navigate = (delta) => {
                const d = new Date(currentDate);
                d.setDate(d.getDate() + (delta * 7));
                setCurrentDate(d);
            };

            const setToday = () => setCurrentDate(new Date());

            const totals = useMemo(() => {
                if (!weekData) return { plan: 0, actual: 0, over: 0 };
                return weekData.days.reduce((acc, d) => ({
                    plan: acc.plan + (parseFloat(d.planHours) || 0),
                    actual: acc.actual + (d.actualHours || 0),
                    over: acc.over + (d.overtimeHours || 0)
                }), { plan: 0, actual: 0, over: 0 });
            }, [weekData]);

            if (!weekData || loading) return <div className="p-5 text-center text-muted">Lade Woche...</div>;

            return (
                <div className="d-flex flex-column flex-grow-1 overflow-hidden">
                    {/* Toolbar */}
                    <div className="bg-white border-bottom p-3 d-flex justify-content-between align-items-center shadow-sm">
                        <div className="d-flex align-items-center gap-3">
                            <h4 className="mb-0 fw-bold">KW {kw} <span className="text-muted fw-normal">/ {year}</span></h4>
                            <div className="btn-group">
                                <button onClick={() => navigate(-1)} className="btn btn-outline-secondary btn-sm"><IconChevronLeft /></button>
                                <button onClick={setToday} className="btn btn-outline-secondary btn-sm fw-bold">Heute</button>
                                <button onClick={() => navigate(1)} className="btn btn-outline-secondary btn-sm"><IconChevronRight /></button>
                            </div>
                        </div>
                        <button onClick={clearWeek} className="btn btn-outline-danger btn-sm">Clear Week</button>
                    </div>

                    {/* Table Container */}
                    <div className="flex-grow-1 overflow-auto scroller p-3">
                        <div className="card shadow-sm border-0">
                            <table className="table table-bordered table-hover mb-0 align-middle">
                                <thead className="table-light">
                                    <tr>
                                        <th style={{ width: '140px' }}>Tag</th>
                                        <th className="text-center" style={{ width: '100px' }}>Plan (h)</th>
                                        <th className="text-center" style={{ width: '100px' }}>Pause (m)</th>
                                        <th className="text-center" style={{ width: '110px' }}>Start</th>
                                        <th className="text-center" style={{ width: '110px' }}>Ende</th>
                                        <th className="text-center text-muted" style={{ width: '110px' }}>Prognose</th>
                                        <th className="text-center" style={{ width: '100px' }}>Ist (h)</th>
                                        <th className="text-center" style={{ width: '100px' }}>Über (h)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {weekData.days.map((day, idx) => (
                                        <tr key={day.weekday}>
                                            <td className="bg-light">
                                                <div className="fw-bold">{day.weekday}</div>
                                                <small className="text-muted">{day.dateISO.split('-').reverse().join('.')}</small>
                                            </td>
                                            <td className="p-1"><input type="number" step="0.25" value={day.planHours} onChange={e => handleDayChange(idx, 'planHours', e.target.value)} className="form-control form-control-sm text-center mx-auto" style={{ minWidth: '60px' }} /></td>
                                            <td className="p-1"><input type="number" step="5" value={day.pauseMin} onChange={e => handleDayChange(idx, 'pauseMin', e.target.value)} className="form-control form-control-sm text-center mx-auto" style={{ minWidth: '60px' }} /></td>
                                            <td className="p-1"><input type="time" value={day.start} onChange={e => handleDayChange(idx, 'start', e.target.value)} className="form-control form-control-sm text-center mx-auto" style={{ minWidth: '90px' }} /></td>
                                            <td className="p-1"><input type="time" value={day.end} onChange={e => handleDayChange(idx, 'end', e.target.value)} className="form-control form-control-sm text-center mx-auto" style={{ minWidth: '90px' }} /></td>
                                            <td className="text-center text-muted font-monospace">{day.forecastEnd}</td>
                                            <td className="text-center fw-medium">{day.actualHours > 0 ? day.actualHours.toFixed(2) : '-'}</td>
                                            <td className={`text-center fw-bold ${day.overtimeHours >= 0 ? 'text-success' : 'text-danger'}`}>
                                                {day.overtimeHours !== 0 ? (day.overtimeHours > 0 ? '+' + day.overtimeHours : day.overtimeHours) : '-'}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                                <tfoot className="table-light fw-bold">
                                    <tr>
                                        <td>Summe</td>
                                        <td className="text-center">{totals.plan.toFixed(2)}</td>
                                        <td colSpan="4"></td>
                                        <td className="text-center">{totals.actual.toFixed(2)}</td>
                                        <td className={`text-center ${totals.over >= 0 ? 'text-success' : 'text-danger'}`}>
                                            {totals.over > 0 ? '+' : ''}{totals.over.toFixed(2)}
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // 3. TASKS TAB
        const TasksTab = ({ dbAuth, setStatus }) => {
            const [date, setDate] = useState(toLocalIsoDate(new Date()));
            const [tasks, setTasks] = useState([]);
            const [loading, setLoading] = useState(false);
            const saveTimeoutRef = useRef(null);

            const [newTaskName, setNewTaskName] = useState("");
            const [newTaskStart, setNewTaskStart] = useState("");

            useEffect(() => { loadTasks(); }, [date]);

            const loadTasks = async () => {
                setLoading(true);
                const client = redisClient(dbAuth);
                try {
                    const res = await client.get(`zeiterfassung:tasks:${date}`);
                    setTasks(res ? JSON.parse(res).rows || [] : []);
                } catch (e) { console.error(e); }
                setLoading(false);
            };

            const triggerAutosave = (newRows) => {
                setStatus({ msg: "Speichere...", type: "info" });
                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                saveTimeoutRef.current = setTimeout(async () => {
                    try {
                        const client = redisClient(dbAuth);
                        await client.set(`zeiterfassung:tasks:${date}`, { dateISO: date, rows: newRows });
                        setStatus({ msg: "Aufgaben gespeichert", type: "success" });
                    } catch (e) {
                        setStatus({ msg: "Fehler beim Speichern", type: "error" });
                    }
                }, 2000); // 2s Debounce
            };

            const sortByStart = (list) => [...list].sort((a, b) => a.start.localeCompare(b.start));

            const addTask = () => {
                if (!newTaskName || !newTaskStart) return;
                let updatedTasks = [...tasks];
                if (updatedTasks.length > 0) {
                    const last = updatedTasks[updatedTasks.length - 1];
                    if (!last.end) {
                        const newLast = { ...last, end: newTaskStart };
                        newLast.durationHours = calcDuration(newLast.start, newLast.end);
                        updatedTasks[updatedTasks.length - 1] = newLast;
                    }
                }
                const newItem = { id: Date.now().toString(), name: newTaskName, start: newTaskStart, end: "", durationHours: 0 };
                updatedTasks.push(newItem);
                updatedTasks = sortByStart(updatedTasks);
                setTasks(updatedTasks);
                triggerAutosave(updatedTasks);
                setNewTaskName("");
                setNewTaskStart("");
            };

            const updateTask = (id, field, val) => {
                const updated = tasks.map(t => {
                    if (t.id === id) {
                        const nt = { ...t, [field]: val };
                        if (nt.start && nt.end) nt.durationHours = calcDuration(nt.start, nt.end);
                        else nt.durationHours = 0;
                        return nt;
                    }
                    return t;
                });
                setTasks(updated);
                triggerAutosave(updated);
            };

            const deleteTask = (id) => {
                const updated = tasks.filter(t => t.id !== id);
                setTasks(updated);
                triggerAutosave(updated);
            };

            const deleteDay = async () => {
                if (!confirm("Diesen Tag löschen?")) return;
                const client = redisClient(dbAuth);
                await client.del(`zeiterfassung:tasks:${date}`);
                setTasks([]);
                setStatus({ msg: "Tag gelöscht", type: "success" });
            };

            const calcDuration = (s, e) => {
                if (!s || !e) return 0;
                const startH = round15Min(s);
                const endH = round15Min(e);
                let dur = endH - startH;
                if (dur < 0) dur = 0;
                return parseFloat(dur.toFixed(2));
            };

            const pivot = useMemo(() => {
                const map = {};
                tasks.forEach(t => {
                    if (t.durationHours > 0) map[t.name] = (map[t.name] || 0) + t.durationHours;
                });
                return Object.entries(map).map(([name, sum]) => ({ name, sum }));
            }, [tasks]);

            return (
                <div className="flex-grow-1 overflow-auto">
                    <div className="container-fluid p-3">
                        {/* Input Row */}
                        <div className="card shadow-sm mb-3">
                            <div className="card-body p-3">
                                <div className="row g-2 align-items-end">
                                    <div className="col-md-2 col-6">
                                        <label className="form-label small fw-bold text-muted text-uppercase mb-1">Datum</label>
                                        <input type="date" value={date} onChange={e => setDate(e.target.value)} className="form-control" />
                                    </div>
                                    <div className="col-md-2 col-6">
                                        <label className="form-label small fw-bold text-muted text-uppercase mb-1">Start</label>
                                        <input type="time" value={newTaskStart} onChange={e => setNewTaskStart(e.target.value)} className="form-control" />
                                    </div>
                                    <div className="col-md-5 col-12">
                                        <label className="form-label small fw-bold text-muted text-uppercase mb-1">Aufgabe</label>
                                        <input type="text" placeholder="Task Name..." value={newTaskName} onChange={e => setNewTaskName(e.target.value)} onKeyDown={e => e.key === "Enter" && addTask()} onFocus={() => { if (!newTaskStart) { const now = new Date(); setNewTaskStart(now.getHours().toString().padStart(2,"0") + ":" + now.getMinutes().toString().padStart(2,"0")); } }} className="form-control" />
                                    </div>
                                    <div className="col-md-3 col-12">
                                        <button onClick={addTask} className="btn btn-primary w-100">Start</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="row g-3">
                            {/* Task List */}
                            <div className="col-md-8">
                                <div className="card shadow-sm">
                                    <div className="card-header bg-white d-flex justify-content-between align-items-center">
                                        <span className="fw-bold">Protokoll</span>
                                        <button onClick={deleteDay} className="btn btn-sm btn-outline-danger" title="Delete Day"><IconTrash /></button>
                                    </div>
                                    <div className="card-body p-2">
                                        {tasks.length === 0 && <p className="text-center text-muted mt-5">Keine Aufgaben erfasst.</p>}
                                        {tasks.map((t) => (
                                            <div key={t.id} className="input-group mb-2">
                                                <input className="form-control" value={t.name} onChange={e => updateTask(t.id, 'name', e.target.value)} />
                                                <input type="time" className="form-control" style={{ maxWidth: '100px' }} value={t.start} onChange={e => updateTask(t.id, 'start', e.target.value)} />
                                                <span className="input-group-text">-</span>
                                                <input type="time" className="form-control" style={{ maxWidth: '100px' }} value={t.end} onChange={e => updateTask(t.id, 'end', e.target.value)} />
                                                <span className="input-group-text fw-bold text-primary" style={{ minWidth: '70px' }}>{t.durationHours > 0 ? t.durationHours.toFixed(2) + 'h' : ''}</span>
                                                <button onClick={() => deleteTask(t.id)} className="btn btn-outline-danger"><IconTrash /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Pivot */}
                            <div className="col-md-4">
                                <div className="card shadow-sm">
                                    <div className="card-header bg-white fw-bold">Zusammenfassung</div>
                                    <div className="card-body p-0">
                                        <table className="table table-sm table-striped mb-0">
                                            <tbody>
                                                {pivot.map(row => (
                                                    <tr key={row.name}>
                                                        <td className="ps-3">{row.name}</td>
                                                        <td className="text-end fw-bold font-monospace pe-3">{row.sum.toFixed(2)} h</td>
                                                    </tr>
                                                ))}
                                                {pivot.length > 0 && (
                                                    <tr className="table-secondary fw-bold">
                                                        <td className="ps-3">Gesamt</td>
                                                        <td className="text-end pe-3">{pivot.reduce((a, b) => a + b.sum, 0).toFixed(2)} h</td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                        {pivot.length === 0 && <p className="text-muted small text-center mt-3">Keine Zeiten kalkuliert.</p>}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [dbAuth, setDbAuth] = useState(null);
            const [activeTab, setActiveTab] = useState('week');
            const [status, setStatus] = useState({ msg: '', type: '' });

            useEffect(() => {
                const stored = getAuth();
                if (stored) setDbAuth(stored);
                else setActiveTab('settings');
            }, []);

            useEffect(() => {
                if (status.msg) {
                    const t = setTimeout(() => setStatus({ msg: '', type: '' }), 5000);
                    return () => clearTimeout(t);
                }
            }, [status]);

            // UPDATE: nav-pills für "Button"-Look
            const TabButton = ({ id, label, icon }) => {
                const isActive = activeTab === id;
                return (
                    <li className="nav-item">
                        <a
                            className={`nav-link d-flex align-items-center gap-2 ${isActive ? 'active' : 'text-secondary'}`}
                            style={{ cursor: 'pointer' }}
                            onClick={() => setActiveTab(id)}
                        >
                            {icon} <span className="d-none d-sm-inline">{label}</span>
                        </a>
                    </li>
                );
            };

            return (
                <div className="d-flex flex-column vh-100 bg-light">
                    {/* Toast Notification (Fixed Top Right) */}
                    {status.msg && (
                        <div className={`position-fixed top-0 end-0 m-3 p-3 rounded shadow text-white z-3 ${status.type === 'error' ? 'bg-danger' : status.type === 'success' ? 'bg-success' : 'bg-primary'}`}
                            style={{ animation: 'fadeIn 0.3s' }}>
                            {status.msg}
                        </div>
                    )}

                    {/* Navbar */}
                    <nav className="navbar navbar-light bg-white border-bottom shadow-sm px-3 flex-shrink-0">
                        <ul className="nav nav-pills w-100 justify-content-start gap-2">
                            <TabButton id="week" label="Wochenerfassung" icon={<IconClock />} />
                            <TabButton id="tasks" label="Tagesaufgaben" icon={<IconCheck />} />
                            <TabButton id="settings" label="DB & Settings" icon={<IconDatabase />} />
                        </ul>
                    </nav>

                    {/* Content */}
                    <div className="flex-grow-1 overflow-hidden d-flex flex-column">
                        {activeTab === 'settings' && <SettingsTab dbAuth={dbAuth} setDbAuth={setDbAuth} setStatus={setStatus} />}
                        {activeTab === 'week' && (
                            dbAuth ? <WeeklyTab dbAuth={dbAuth} setStatus={setStatus} /> : <div className="p-5 text-center">Bitte zuerst DB verbinden.</div>
                        )}
                        {activeTab === 'tasks' && (
                            dbAuth ? <TasksTab dbAuth={dbAuth} setStatus={setStatus} /> : <div className="p-5 text-center">Bitte zuerst DB verbinden.</div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
