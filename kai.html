<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAI – KI Assistent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Linke Seite: Chat ── */
    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 12px;
      min-width: 0;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 6px;
    }

    .message {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 15px;
      word-break: break-word;
    }

    .message.user {
      background: #4a6cf7;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: #2d2d44;
      color: #e0e0e0;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    #status {
      text-align: center;
      font-size: 13px;
      color: #888;
      min-height: 18px;
    }

    #model-indicator {
      text-align: center;
      font-size: 12px;
      color: #9ab0ff;
      min-height: 18px;
      padding-top: 2px;
    }

    #input-area {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px 14px;
      background: #16213e;
      border-radius: 28px;
    }

    #mic-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: #4a6cf7;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #mic-btn.recording {
      background: #e74c3c;
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0   rgba(231,76,60,.5); }
      50%       { transform: scale(1.07); box-shadow: 0 0 0 10px rgba(231,76,60,0); }
    }

    #text-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
      resize: none;
      height: 26px;
      max-height: 120px;
      overflow-y: auto;
      line-height: 26px;
      font-family: inherit;
    }

    #text-input::placeholder { color: #555; }

    #send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #4a6cf7;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    #send-btn:hover:not(:disabled) { background: #6080ff; }
    #send-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Rechte Seite: System-Prompts ── */
    #side-panel {
      width: 290px;
      background: #16213e;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-left: 1px solid #2a2a40;
      overflow-y: auto;
    }

    #side-panel h3 {
      color: #4a6cf7;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding-bottom: 4px;
      border-bottom: 1px solid #2a2a40;
    }

    .prompt-item { display: flex; flex-direction: column; gap: 5px; }

    .prompt-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prompt-header input[type="radio"] { accent-color: #4a6cf7; cursor: pointer; }

    .prompt-header label {
      font-size: 13px;
      color: #aaa;
      cursor: pointer;
    }

    .prompt-textarea {
      width: 100%;
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      color: #e0e0e0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      resize: vertical;
      min-height: 80px;
      outline: none;
      font-family: inherit;
      line-height: 1.45;
      transition: border-color 0.2s;
    }

    .prompt-textarea:focus { border-color: #4a6cf7; }

    #api-key-input {
      width: 100%;
      height: 36px;
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      color: #e0e0e0;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      outline: none;
      font-family: monospace;
      transition: border-color 0.2s;
    }

    #api-key-input:focus { border-color: #4a6cf7; }

    .api-key-link,
    .api-key-link:visited {
      color: #4a6cf7;
      text-decoration: none;
    }

    .api-key-link:hover {
      text-decoration: underline;
    }

    #models-list {
      max-height: 200px;
      overflow-y: auto;
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .model-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #2a2a40;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      color: #aaa;
      transition: background 0.2s;
    }

    .model-item:hover { background: #3a3a50; }

    .model-item input[type="radio"] { accent-color: #4a6cf7; cursor: pointer; }

    .model-item.selected { background: #4a6cf7; color: #fff; }

    #refresh-models-btn {
      width: 100%;
      padding: 8px;
      background: #2a4a8f;
      color: #e0e0e0;
      border: 1px solid #4a6cf7;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }

    #refresh-models-btn:hover { background: #3a5a9f; }

    #reset-btn {
      margin-top: auto;
      padding: 10px;
      background: transparent;
      color: #e74c3c;
      border: 1px solid #e74c3c;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s, color 0.2s;
    }

    #reset-btn:hover { background: #e74c3c; color: #fff; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2d2d44; border-radius: 3px; }
  </style>
</head>
<body>

<!-- Linke Seite -->
<div id="chat-container">
  <div id="chat-messages"></div>
  <div id="model-indicator">Modell: <span id="active-model-name">-</span></div>
  <div id="status"></div>
  <div id="input-area">
    <button id="mic-btn" title="Aufnehmen / Stoppen">🎤</button>
    <textarea id="text-input" placeholder="Nachricht eingeben…" rows="1"></textarea>
    <button id="send-btn" title="Senden">&#9658;</button>
  </div>
</div>

<!-- Rechte Seite -->
<div id="side-panel">
  <h3><a href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer" class="api-key-link">🔑 API Key</a></h3>
  <input type="password" id="api-key-input" placeholder="gsk_...">

  <h3>🤖 Modell</h3>
  <button id="refresh-models-btn">↻ Modelle aktualisieren</button>
  <div id="models-list"></div>

  <h3>System-Prompts</h3>

  <div class="prompt-item">
    <div class="prompt-header">
      <input type="radio" name="sp" id="sp0" value="0" checked>
      <label for="sp0">Prompt 1</label>
    </div>
    <textarea class="prompt-textarea" id="sp-text-0" placeholder="System-Prompt 1…"></textarea>
  </div>

  <div class="prompt-item">
    <div class="prompt-header">
      <input type="radio" name="sp" id="sp1" value="1">
      <label for="sp1">Prompt 2</label>
    </div>
    <textarea class="prompt-textarea" id="sp-text-1" placeholder="System-Prompt 2…"></textarea>
  </div>

  <div class="prompt-item">
    <div class="prompt-header">
      <input type="radio" name="sp" id="sp2" value="2">
      <label for="sp2">Prompt 3</label>
    </div>
    <textarea class="prompt-textarea" id="sp-text-2" placeholder="System-Prompt 3…"></textarea>
  </div>

  <button id="reset-btn">&#128465; Chat zurücksetzen</button>
</div>

<script>
// ── DOM ──
const chatMessages = document.getElementById('chat-messages');
const textInput    = document.getElementById('text-input');
const micBtn       = document.getElementById('mic-btn');
const sendBtn      = document.getElementById('send-btn');
const statusEl     = document.getElementById('status');
const modelIndicator = document.getElementById('model-indicator');
const activeModelName = document.getElementById('active-model-name');
const resetBtn     = document.getElementById('reset-btn');
const spTexts      = [0, 1, 2].map(i => document.getElementById(`sp-text-${i}`));
const apiKeyInput  = document.getElementById('api-key-input');
const modelsList   = document.getElementById('models-list');
const refreshModelsBtn = document.getElementById('refresh-models-btn');

// ── State ──
let chatHistory  = [];
let isRecording  = false;
let mediaRecorder = null;
let audioChunks  = [];
let availableModels = [];
const SAFE_DEFAULT_MODELS = ['compound'];
let currentModel = localStorage.getItem('kai_model') || SAFE_DEFAULT_MODELS[0];

// ── Default-Prompts ──
const DEFAULT_PROMPTS = [
  'Du bist KAI, ein hilfreicher KI-Assistent. Antworte auf Deutsch, freundlich und präzise.',
  'Du bist ein erfahrener Softwareentwickler. Hilf bei Programmierung, Debugging und technischen Fragen.',
  'Du bist ein kreativer Schreibassistent. Hilf beim Verfassen von Texten, Ideen und Konzepten.',
];

// ── Cache ──
function loadCache() {
  const saved = localStorage.getItem('kai_history');
  if (saved) chatHistory = JSON.parse(saved);

  const activeIdx = localStorage.getItem('kai_active_prompt') || '0';
  const radio = document.querySelector(`input[name="sp"][value="${activeIdx}"]`);
  if (radio) radio.checked = true;

  spTexts.forEach((ta, i) => {
    ta.value = localStorage.getItem(`kai_sp_${i}`) ?? DEFAULT_PROMPTS[i];
  });

  const savedApiKey = localStorage.getItem('kai_api_key');
  if (savedApiKey) apiKeyInput.value = savedApiKey;

  const savedModel = localStorage.getItem('kai_model');
  if (savedModel) {
    const cleaned = (savedModel || '').trim();
    if (cleaned && cleaned !== 'allam-2-7b' && cleaned !== 'allam') {
      currentModel = cleaned;
    } else {
      currentModel = SAFE_DEFAULT_MODELS[0];
      localStorage.setItem('kai_model', SAFE_DEFAULT_MODELS[0]);
    }
  } else {
    currentModel = SAFE_DEFAULT_MODELS[0];
    localStorage.setItem('kai_model', SAFE_DEFAULT_MODELS[0]);
  }
}

function getApiKey() {
  const key = apiKeyInput.value.trim();
  if (!key) {
    setStatus('⚠️ Bitte zuerst API Key eingeben!');
    apiKeyInput.focus();
    return null;
  }
  return key;
}

function isChatModel(modelId) {
  const lower = (modelId || '').toLowerCase();
  return !(
    lower.includes('whisper') ||
    lower.includes('transcription') ||
    lower.includes('tts') ||
    lower.includes('speech') ||
    lower.includes('audio') ||
    lower.includes('text-to-speech') ||
    lower.includes('allam-2-7b') ||
    lower.includes('allam')
  );
}

function getFallbackModel() {
  if (availableModels.length > 0) {
    const preferred = SAFE_DEFAULT_MODELS.find(m => availableModels.includes(m));
    return preferred || availableModels[0];
  }
  return SAFE_DEFAULT_MODELS[0];
}

function getSelectedModel() {
  if (availableModels.length > 0) {
    const cleanedCurrent = (currentModel || '').trim();
    if (cleanedCurrent && availableModels.includes(cleanedCurrent)) return cleanedCurrent;
    const fallback = getFallbackModel();
    currentModel = fallback;
    localStorage.setItem('kai_model', fallback);
    renderModelsList();
    return fallback;
  }

  return currentModel || SAFE_DEFAULT_MODELS[0];
}

async function loadModels() {
  const apiKey = getApiKey();
  if (!apiKey) return;

  setStatus('Modelle werden geladen...');
  modelsList.innerHTML = '<div style="padding: 12px; text-align: center; color: #888;">Lädt...</div>';

  try {
    const res = await fetch('https://api.groq.com/openai/v1/models', {
      headers: { Authorization: `Bearer ${apiKey}` },
    });
    if (!res.ok) {
      if (res.status === 403) {
        throw new Error('HTTP 403 – API-Key oder Modell-Zugriff nicht erlaubt. Bitte in groq/keys prüfen.');
      }
      throw new Error(`HTTP ${res.status}`);
    }
    const data = await res.json();
    availableModels = (data.data || [])
      .map(m => m.id)
      .filter(Boolean)
      .filter(isChatModel);

    if (availableModels.length === 0) {
      throw new Error('Keine Chat-Modelle für diesen API-Key verfügbar.');
    }
    if (!availableModels.includes(currentModel) || currentModel === 'allam-2-7b' || currentModel === 'allam') {
      currentModel = getFallbackModel();
      localStorage.setItem('kai_model', currentModel);
    }
    updateModelIndicator();
    renderModelsList();
    setStatus('');
  } catch (err) {
    setStatus(err.message);
    modelsList.innerHTML = '<div style="padding: 12px; text-align: center; color: #e74c3c;">Fehler beim Laden</div>';
  }
}

function renderModelsList() {
  modelsList.innerHTML = '';
  if (availableModels.length === 0) {
    modelsList.innerHTML = '<div style="padding: 12px; text-align: center; color: #888;">Keine Modelle</div>';
    return;
  }
  availableModels.forEach((model, idx) => {
    const div = document.createElement('div');
    div.className = 'model-item' + (model === currentModel ? ' selected' : '');
    div.innerHTML = `<input type="radio" name="model" value="${model}" id="model-${idx}" ${model === currentModel ? 'checked' : ''}><label for="model-${idx}" style="flex: 1; cursor: pointer;">${model}</label>`;
    div.querySelector('input').addEventListener('change', () => {
      currentModel = model;
      localStorage.setItem('kai_model', model);
      updateModelIndicator();
      renderModelsList();
      setStatus(`Modell gewählt: ${model}`);
    });
    modelsList.appendChild(div);
  });
}

refreshModelsBtn.addEventListener('click', loadModels);
apiKeyInput.addEventListener('change', () => {
  localStorage.setItem('kai_api_key', apiKeyInput.value.trim());
  setStatus('API Key gespeichert');
});

function saveHistory() {
  localStorage.setItem('kai_history', JSON.stringify(chatHistory));
}

function savePrompts() {
  spTexts.forEach((ta, i) => localStorage.setItem(`kai_sp_${i}`, ta.value));
  const active = document.querySelector('input[name="sp"]:checked').value;
  localStorage.setItem('kai_active_prompt', active);
}

function getSystemPrompt() {
  const idx = parseInt(document.querySelector('input[name="sp"]:checked').value, 10);
  return spTexts[idx].value.trim() || DEFAULT_PROMPTS[idx];
}

// ── Render ──
function renderMessages() {
  chatMessages.innerHTML = '';
  chatHistory.forEach(msg => {
    if (msg.role === 'system') return;
    const div = document.createElement('div');
    div.className = `message ${msg.role}`;
    div.textContent = msg.content;
    chatMessages.appendChild(div);
  });
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function setStatus(text) { statusEl.textContent = text; }

function updateModelIndicator() {
  activeModelName.textContent = currentModel || 'nicht gesetzt';
}

function pushMessage(role, content) {
  chatHistory.push({ role, content });
  saveHistory();
  renderMessages();
}

// ── Mikrofon ──
micBtn.addEventListener('click', async () => {
  if (isRecording) stopRecording();
  else await startRecording();
});

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];

    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg']
      .find(t => MediaRecorder.isTypeSupported(t)) || 'audio/webm';

    mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
    mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: mime });
      await transcribe(blob, mime);
    };

    mediaRecorder.start();
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹';
    setStatus('Aufnahme läuft…');
  } catch (err) {
    setStatus('Mikrofon-Fehler: ' + err.message);
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
    setStatus('Transkribiere…');
  }
}

// ── Whisper ──
async function transcribe(blob, mime) {
  const apiKey = getApiKey();
  if (!apiKey) return;

  const ext = mime.includes('ogg') ? 'ogg' : 'webm';
  const form = new FormData();
  form.append('file', blob, `audio.${ext}`);
  form.append('model', 'whisper-large-v3-turbo');
  form.append('language', 'de');
  form.append('response_format', 'json');

  try {
    const res  = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
      method: 'POST',
      headers: { Authorization: `Bearer ${apiKey}` },
      body: form,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const text = (data.text || '').trim();
    if (text) {
      textInput.value = text;
      autoResize();
      setStatus('Transkription fertig – Senden mit ↵ oder ▶');
    } else {
      setStatus('Keine Sprache erkannt');
    }
  } catch (err) {
    setStatus('Transkriptions-Fehler: ' + err.message);
  }
}

// ── Chat ──
async function sendMessage() {
  const text = textInput.value.trim();
  if (!text) return;

  const apiKey = getApiKey();
  if (!apiKey) return;

  textInput.value = '';
  autoResize();
  pushMessage('user', text);
  setStatus('KAI denkt…');
  sendBtn.disabled = true;

  const messages = [
    { role: 'system', content: getSystemPrompt() },
    ...chatHistory.filter(m => m.role !== 'system'),
  ];

  try {
    const modelToUse = getSelectedModel();
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${apiKey}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: modelToUse,
        messages,
        temperature: 0.7,
      }),
    });
    if (!res.ok) {
      if (res.status === 403) {
        const fallback = getFallbackModel();
        currentModel = fallback;
        localStorage.setItem('kai_model', fallback);
        renderModelsList();
        throw new Error(`HTTP 403 – Modell "${modelToUse}" nicht freigegeben. Auf "${fallback}" zurückgesetzt.`);
      }
      throw new Error(`HTTP ${res.status}`);
    }
    const data  = await res.json();
    const reply = data.choices[0].message.content.trim();

    pushMessage('assistant', reply);
    setStatus('');
    speak(reply);
  } catch (err) {
    setStatus('Fehler: ' + err.message);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', sendMessage);

textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function autoResize() {
  textInput.style.height = '26px';
  textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
}
textInput.addEventListener('input', autoResize);

// ── TTS – Browser Web Speech API ──
let isSpeaking = false;
let selectedVoice = null;

if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {
    const voices = window.speechSynthesis.getVoices();
    selectedVoice = voices.find(voice => voice.name.includes('Google') && voice.lang.startsWith('de'));
    if (!selectedVoice) selectedVoice = voices.find(voice => voice.lang.startsWith('de'));
  };
  window.speechSynthesis.getVoices();
}

function speak(text) {
  if (!window.speechSynthesis) return;
  
  window.speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'de-DE';
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  
  if (selectedVoice) utterance.voice = selectedVoice;
  
  utterance.onend = () => { isSpeaking = false; };
  utterance.onerror = (e) => { console.error('TTS Fehler:', e.error); isSpeaking = false; };
  
  window.speechSynthesis.speak(utterance);
  isSpeaking = true;
}

// ── Reset ──
resetBtn.addEventListener('click', () => {
  if (!confirm('Chat-Verlauf wirklich löschen?')) return;
  chatHistory = [];
  localStorage.removeItem('kai_history');
  renderMessages();
  setStatus('Chat zurückgesetzt');
});

// ── Prompts speichern bei Änderung ──
spTexts.forEach(ta => ta.addEventListener('input', savePrompts));
document.querySelectorAll('input[name="sp"]').forEach(r => r.addEventListener('change', savePrompts));

// ── Start ──
loadCache();
updateModelIndicator();
renderMessages();
</script>
</body>
</html>
